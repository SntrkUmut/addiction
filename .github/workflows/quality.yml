name: Mobile quality checks

on:
  pull_request:
  push:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Domain tests
        run: npm test

      - name: Check Expo configuration and dependencies
        run: npx expo-doctor

      - name: Check content manifest and editorial
        run: |
          python3 src/content/editorial.py src/content/manifest.example.json
          python3 src/content/tr_spell.py src/content/manifest.example.json
          python3 src/content/check_manifest.py src/content/manifest.example.json
          python3 src/content/test_check_manifest.py
